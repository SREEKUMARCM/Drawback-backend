syntax = "proto3";

package drawback.user.v1;

option java_multiple_files = true;
option java_package = "com.drawback.grpc.user";
option java_outer_classname = "UserDirectoryProto";

// Read-only user lookup exposed by auth-service to the other services.
// Callers must send the end user's JWT in the "authorization" metadata (Bearer ...).
service UserDirectory {
  rpc GetUser (GetUserRequest) returns (UserProfile);
  rpc GetUsers (GetUsersRequest) returns (GetUsersResponse);
  rpc GetUserByUsername (GetUserByUsernameRequest) returns (UserProfile);
}

message GetUserRequest { string user_id = 1; }
message GetUsersRequest { repeated string user_ids = 1; }   // max 100
message GetUsersResponse { repeated UserProfile users = 1; }
message GetUserByUsernameRequest { string username = 1; }   // case-insensitive

enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  ACTIVE = 1;
  SUSPENDED = 2;
}

message UserProfile {
  string id = 1;
  string username = 2;
  string display_name = 3;
  bool verified = 4;
  UserStatus status = 5;
  int64 review_count = 6;
  repeated string roles = 7;
  // added for the Drawback web app (all optional / backward compatible)
  string avatar_url = 8;
  string bio = 9;
  string location = 10;
  repeated string interests = 11;
  int64 joined_at_epoch_ms = 12;
  bool onboarded = 13;
}
