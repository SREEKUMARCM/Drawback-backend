spring:
  application:
    name: notification-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notification_db}
    username: ${DB_USER:drawback}
    password: ${DB_PASSWORD:drawback}
    hikari:
      maximum-pool-size: ${DB_POOL:15}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 500ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.drawback.events
        spring.json.use.type.headers: false
    listener:
      ack-mode: record

server:
  port: 8084
  shutdown: graceful
  forward-headers-strategy: native

drawback:
  security:
    public-paths:
      - /actuator/health/**
    jwt:
      secret: ${JWT_SECRET}
      issuer: drawback-auth

management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
  server.port: 9084
