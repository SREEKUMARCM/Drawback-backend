spring:
  application:
    name: review-service
  threads:
    virtual:
      enabled: false           # explicit bounded pools (ioExecutor/batchExecutor) are used for fan-out; flip to true to experiment
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/review_db}
    username: ${DB_USER:drawback}
    password: ${DB_PASSWORD:drawback}
    hikari:
      maximum-pool-size: ${DB_POOL:30}
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 300ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer   # payload is already JSON from the outbox
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        linger.ms: 5
        compression.type: lz4

server:
  port: 8082
  shutdown: graceful
  forward-headers-strategy: native

grpc:
  client:
    auth-service:
      address: ${AUTH_GRPC_ADDRESS:static://localhost:9091}
      negotiation-type: ${GRPC_NEGOTIATION:plaintext}   # use TLS (mTLS via the mesh) in production

drawback:
  security:
    public-paths:
      - /actuator/health/**
    jwt:
      secret: ${JWT_SECRET}
      issuer: drawback-auth
  review:
    author-timeout-ms: 400
    user-check:
      fail-open: true
      deadline-ms: 500
  outbox:
    poll-ms: 500
    batch-size: 200

management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
  server.port: 9082
